version: "3"
services:
  nextcloud:
    image: nextcloud:28.0.12
    ports:
      - "192.168.20.10:8080:80"
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: Admin@2025Demo
    volumes:
      - nextcloud_data:/var/www/html
    restart: unless-stopped

volumes:
  nextcloud_data:
